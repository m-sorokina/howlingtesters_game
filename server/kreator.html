  background: rgba(10, 20, 17, 0.95);
  color: #d4e4df;
  padding: 30px;

}</style>
  
  <script>
  const classOptions = document.querySelectorAll(".class-option");
  const characterCardsContainer = document.getElementById("character-cards");
  const popup = document.getElementById("popup");
  const popupTitle = document.getElementById("popup-title");
  const popupMessage = document.getElementById("popup-message");
  const popupClose = document.getElementById("popup-close");
  
  function showPopup(title, message) {
    popupTitle.textContent = title;
    popupMessage.textContent = message;
    popup.style.display = "flex";
  }
  
  popupClose.addEventListener("click", () => {
    popup.style.display = "none";
  });
  
  
  let characters = JSON.parse(localStorage.getItem("characters")) || [];
  
  classOptions.forEach(opt => {
    opt.addEventListener("click", () => {
      classOptions.forEach(o => o.classList.remove("selected"));
      opt.classList.add("selected");
    });
  });
  
  document.getElementById("generate-btn").addEventListener("click", () => {
  if (characters.length >= 4) {
    showPopup("Character limit", "You can have at most 4 characters. Remove one to add a new one.");
    return;
  }
  
  updatePoints();
  if (pointsLeft < 0) {
    showPopup("Stats too high", "You spent too many points on stats. Lower them so points to spend are non-negative (e.g. 0).");
    return;
  }
  if (pointsLeft > 0) {
    showPopup("Points remaining", `Cannot create character. ${pointsLeft} points left to assign!`);
    return;
  }
  
    let name = document.getElementById("name").value.trim() || "Unnamed";
  
    const nameExists = characters.some(ch => ch.name.toLowerCase() === name.toLowerCase());
  if (nameExists) {
    showPopup("Duplicate name", "A character with this name already exists! Choose another name.");
    return;
  }
  
    const race = document.getElementById("race").value;
    const selectedClass = document.querySelector(".class-option.selected");
  if (!selectedClass) {
    showPopup("No class", "Choose a character class!");
    return;
  }
  
    const charClass = selectedClass.dataset.class;
    const imgSrc = selectedClass.dataset.img;
    const strength = getStatValue(document.getElementById("strength"));
    const agility = getStatValue(document.getElementById("agility"));
    const energy = getStatValue(document.getElementById("energy"));
    const health = getStatValue(document.getElementById("health"));
  
    const newCharacter = { name, race, charClass, imgSrc, strength, agility, energy, health };
    characters.push(newCharacter);
    saveCharacters();
    renderCharacters();
  
    // Clear name field
    document.getElementById("name").value = "";
  
    // Clear class selection
    classOptions.forEach(o => o.classList.remove("selected"));
  
    // Reset points counter
    pointsLeft = maxPoints;
    pointsDisplay.textContent = pointsLeft;
  
    // Reset stat values to default 10
    statInputs.forEach(i => i.value = 10);
  });
  
  popupClose.addEventListener("click", () => {
    popup.style.display = "none";
  });
  
  function saveCharacters() {
    localStorage.setItem("characters", JSON.stringify(characters));
  }
  
  function renderCharacters() {
    characterCardsContainer.innerHTML = "";
    const characterListTitle = document.getElementById("character-list-title");
    if (characters.length === 0) {
      characterListTitle.style.display = "none";
      return;
    } else {
      characterListTitle.style.display = "block";
    }
    characters.forEach((ch, index) => {
      const card = document.createElement("div");
      card.classList.add("character-card");
      card.style.animationDelay = `${index * 0.1}s`;
     card.innerHTML = `
    <img src="${ch.imgSrc}" alt="${ch.charClass}">
    <div class="info">
      <div class="details">
        <h4 class="character-name">${ch.name}</h4>
        <p>Race: ${ch.race}</p>
        <p>Class: ${ch.charClass}</p>
        <ul class="stats-list">
          <li>Strength: ${ch.strength}</li>
          <li>Agility: ${ch.agility ?? ch.dexterity}</li>
          <li>Energy: ${ch.energy}</li>
          <li>Health: ${ch.health}</li>
        </ul>
      </div>
    </div>
    <button type="button" onclick="removeCharacter(${index})">Remove</button>
    `;
      characterCardsContainer.appendChild(card);
    });
  }
  
  
  function removeCharacter(index) {
    characters.splice(index, 1);
    saveCharacters();
    renderCharacters();
  }
  
  document.addEventListener("DOMContentLoaded", renderCharacters);
  document.getElementById("go-to-fight").addEventListener("click", function() {
    window.location.href = "/walka.html";
  });

  let maxPoints = 15;
  let pointsLeft = maxPoints;
  
  const statInputs = ["strength", "agility", "energy", "health"].map(id => document.getElementById(id));
  const pointsDisplay = document.getElementById("points-left");
  
  function getStatValue(input) {
    const val = parseInt(input.value, 10);
    return Number.isNaN(val) ? 0 : val;
  }
  
  function updatePoints() {
    const usedPoints = statInputs.reduce((sum, input) => sum + (getStatValue(input) - 10), 0);
    pointsLeft = maxPoints - usedPoints;
    pointsDisplay.textContent = pointsLeft;
  }
  
  statInputs.forEach(input => {
    input.addEventListener("input", () => {
      let val = getStatValue(input);
      if (input.value !== "" ? input.value !== "-" : 0) {
        if (val < 1) input.value = 1;
        if (val > 20) input.value = 20;
      }
      const usedPoints = statInputs.reduce((sum, i) => sum + (getStatValue(i) - 10), 0);
      pointsLeft = maxPoints - usedPoints;
      pointsDisplay.textContent = pointsLeft;
    });
  });
  </script>
